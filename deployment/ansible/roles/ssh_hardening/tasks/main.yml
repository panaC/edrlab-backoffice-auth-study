---
- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install sshd hardening drop-in
  ansible.builtin.template:
    src: 99-backoffice-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-backoffice-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - test sshd configuration
    - reload ssh
