name: backoffice-auth-ansible-lab

services:
  debian-vps:
    build:
      context: ./target
    hostname: debian-vps
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      ansible_lab:
        ipv4_address: 172.28.47.10

  ansible-control:
    build:
      context: ./control
    depends_on:
      - debian-vps
    environment:
      LAB_TARGET_HOST: 172.28.47.10
      LAB_RUN_FULL_DEPLOY: "${LAB_RUN_FULL_DEPLOY:-0}"
    working_dir: /work/deployment/ansible
    volumes:
      - ../../..:/work
      - ansible-lab-runtime:/lab
    networks:
      ansible_lab:
        ipv4_address: 172.28.47.20

networks:
  ansible_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.47.0/24

volumes:
  ansible-lab-runtime:
